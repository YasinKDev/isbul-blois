name: Offres du jour

on:
  schedule:
    - cron: "0 5 * * *"   # 6 h à Blois l'hiver, 7 h l'été
    - cron: "0 12 * * *"  # deuxième passage à midi (13 h / 14 h)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte + tri Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISBUL_PROFILE: ${{ secrets.ISBUL_PROFILE }}
        run: python pipeline/run.py

      - name: Publier les offres
        run: |
          git config user.name "isbul-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/offers.json
          git diff --cached --quiet || git commit -m "Offres du $(date +%F)"
          git push
